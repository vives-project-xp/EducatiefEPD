{% extends 'base.html' %}
{% block title %}Opleidingen | Educatief EPD{% endblock %}
{% block content %}<main class="teacher-shell">
  <header class="page-bar"><div><p class="eyebrow">Beheer</p><h1>Opleidingen</h1></div><div class="header-actions"><a class="primary" href="{% url 'dossier:education_create' %}">Opleiding toevoegen</a><a class="back" href="{% url 'dossier:teacher_dashboard' %}">← Dashboard</a></div></header>
  <div class="teacher-list">{% for education in educations %}<a class="teacher-row" href="{% url 'dossier:education_edit' education.id %}"><strong>{{ education.name }}</strong><span>{{ education.slug }}</span></a>{% empty %}<p class="empty-state">Nog geen opleidingen.</p>{% endfor %}</div>
</main>{% endblock %}
