<div class="observation-list">
  {% for observation in field.value %}<div class="observation-row"><time>{{ observation.timestamp|default:'Geen tijdstip' }}</time><strong>{{ observation.value }}</strong><span>{{ observation.note }}</span></div>{% empty %}<p class="muted">Nog geen observaties.</p>{% endfor %}
</div>
{% if not locked %}
  <div class="observation-entry">
    <input type="{% if field.errors %}text{% else %}datetime-local{% endif %}" name="observation_timestamp_{{ field.key }}" value="{{ field.pending_observation.timestamp }}" aria-label="{{ field.label }}: tijdstip" {% if field.errors %}aria-invalid="true" aria-describedby="errors_{{ field.key }}"{% endif %}>
    <input id="{% if function_observation %}function_{% else %}field_{% endif %}{{ field.key }}" name="observation_value_{{ field.key }}" value="{{ field.pending_observation.value }}" placeholder="Waarde of observatie" aria-label="{{ field.label }}: waarde of observatie" {% if field.errors %}aria-invalid="true" aria-describedby="errors_{{ field.key }}"{% endif %}>
    <input name="observation_note_{{ field.key }}" value="{{ field.pending_observation.note }}" placeholder="Toelichting" aria-label="{{ field.label }}: toelichting">
    <button class="outline button" name="action" value="{% if function_observation %}save{% else %}add_observation:{{ field.key }}{% endif %}">Observatie en wijzigingen bewaren</button>
  </div>
{% endif %}
