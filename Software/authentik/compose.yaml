services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
    volumes:
      - authentik_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    environment: &authentik_environment
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      EPD_OIDC_CLIENT_SECRET: ${EPD_OIDC_CLIENT_SECRET:-}
      EPD_OIDC_SECOND_CLIENT_SECRET: ${EPD_OIDC_SECOND_CLIENT_SECRET:-}
      EPD_TEST_ADMIN_PASSWORD: ${EPD_TEST_ADMIN_PASSWORD:-}
      EPD_TEST_STUDENT_PASSWORD: ${EPD_TEST_STUDENT_PASSWORD:-}
      EPD_TEST_TEACHER_PASSWORD: ${EPD_TEST_TEACHER_PASSWORD:-}
      EPD_TEST_MANAGER_PASSWORD: ${EPD_TEST_MANAGER_PASSWORD:-}
    ports:
      - "9000:9000"
    volumes:
      - authentik_media:/data
      - ./bootstrap.py:/epd-bootstrap/bootstrap.py:ro
    depends_on:
      postgresql:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker
    environment: *authentik_environment
    volumes:
      - authentik_media:/data
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  authentik_database:
  authentik_media:
