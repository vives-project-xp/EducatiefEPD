name: Deploy checks

# Draait zelfstandig bij pull requests en handmatig; op main wordt deze workflow
# aangeroepen door release.yml, zodat de release pas na geslaagde tests start.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy-checks:
    name: Deployment regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy, health and pull unit tests
        run: python -m unittest discover -s Software/tests/deploy -v
      - name: Validate entrypoint syntax
        run: sh -n Software/entrypoint.sh
      - name: Validate production Compose with dummy configuration
        run: python Software/tests/deploy/check_compose.py
      - name: Validate user timer and service
        run: |
          runtime_dir=$(mktemp -d)
          trap 'rm -rf -- "$runtime_dir"' EXIT
          XDG_RUNTIME_DIR="$runtime_dir" systemd-analyze --user verify \
            Software/deploy/epd-pull.service Software/deploy/epd-pull.timer
