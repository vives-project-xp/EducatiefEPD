name: Django tests

# Draait zelfstandig bij pull requests en handmatig; op main wordt deze workflow
# aangeroepen door release.yml, zodat de release pas na geslaagde tests start.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  django-tests:
    name: Django + MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epd_ci
          MYSQL_USER: epd_ci
          MYSQL_PASSWORD: epd_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "1"
      MYSQL_DATABASE: epd_ci
      # root met bekende (niet-secret) CI-wachtwoord: Django's testrunner moet
      # zelf de test_epd_ci-database kunnen aanmaken, wat gewone gebruikers
      # niet mag.
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Software/requirements.txt
      - name: Install dependencies
        run: pip install -r Software/requirements.txt
      - name: System check
        working-directory: Software
        run: python manage.py check
      - name: No unmanaged model changes
        working-directory: Software
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite
        working-directory: Software
        run: python manage.py test tests.dossier --verbosity 1
